services:
  - type: web
    name: invoice-extraction-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: invoice-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/invoices.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: LOG_JSON
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
