[project]
name = "invoice-intelligence-platform"
version = "1.0.0"
description = "Production-grade Intelligent Document Processing platform for invoice extraction"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bilal Choudhary" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    # Validation & config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Image processing & OCR
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.3.0",
    "pytesseract>=0.3.10",
    "numpy>=1.26.0",
    # PDF support
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    # Logging
    "structlog>=24.1.0",
    # File handling
    "aiofiles>=24.1.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "openpyxl>=3.1.0",
    "imagehash>=4.3.1",
    # HTTP client (for VLM APIs)
    "httpx>=0.27.0",
    # Rate limiting
    "slowapi>=0.1.9",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
# Optional local-full profile.  The base install remains lightweight for the
# portfolio/demo path, while this extra enables the recommended open-source
# layout stack when the host can run PaddlePaddle and Docling.
local-full = [
    "paddlepaddle>=3.0.0",
    "paddleocr[doc-parser]>=3.0.0",
    "docling>=2.0.0",
]
# The official Paddle 3.3 CPU image already contains PaddlePaddle. This extra
# adds the document-parser feature group without installing a second Paddle wheel.
docker-local-full = [
    "paddleocr[doc-parser]>=3.0.0",
    "docling>=2.0.0",
]
# Camelot is useful for ruled digital-PDF tables but remains optional because
# its native backends add system-level dependencies that demo deployments do
# not need.
pdf-tables = [
    "camelot-py[cv]>=0.11.0",
]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "coverage>=7.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]


[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"] # FastAPI intentionally constructs dependency markers in signatures

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
