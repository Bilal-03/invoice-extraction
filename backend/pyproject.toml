[project]
name = "invoice-intelligence-platform"
version = "1.0.0"
description = "Production-grade Intelligent Document Processing platform for invoice extraction"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bilal Choudhary" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    # Validation & config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Image processing & OCR
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.3.0",
    "pytesseract>=0.3.10",
    "numpy>=1.26.0",
    # PDF support
    "PyMuPDF>=1.24.0",
    # Logging
    "structlog>=24.1.0",
    # File handling
    "aiofiles>=24.1.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "imagehash>=4.3.1",
    # HTTP client (for VLM APIs)
    "httpx>=0.27.0",
    # Rate limiting
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
paddleocr = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
]
vlm = [
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "coverage>=7.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"] # FastAPI intentionally constructs dependency markers in signatures

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
